<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertai — Loading</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #06080f;
    color: #f0f4ff;
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    flex-direction: column;
    gap: 20px;
  }
  .logo {
    font-size: 14px;
    letter-spacing: 0.15em;
    color: #64748b;
    text-transform: uppercase;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid rgba(37,99,235,0.2);
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="spinner"></div>
<div class="logo">VERTAI</div>

<script>
(async () => {
  try {
    // Call a free IP geolocation API to get the visitor's country
    const res = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(3000) });
    const data = await res.json();
    const country = (data.country_code || '').toUpperCase();

    // Chinese mainland IP → Chinese version; everything else → English
    if (country === 'CN') {
      window.location.replace('./vertai-zh.html');
    } else {
      window.location.replace('./vertai-en.html');
    }
  } catch (e) {
    // If geolocation fails for any reason, default to English
    window.location.replace('./vertai-en.html');
  }
})();
</script>
</body>
</html>
